services:
  url-to-hugo-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-to-hugo-generator
    restart: unless-stopped
    ports:
      - "3000-3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - GENERATED_DIR=/app/generated
    volumes:
      - generated:/app/generated
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  generated:
    driver: local
